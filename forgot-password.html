<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lupa kata sandi · Kontrol</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('kontrol:theme') || '"system"');
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <button type="button" class="icon-btn theme-fab" data-theme-toggle aria-label="Ganti tema"></button>
  <main class="auth auth--center">
    <section class="auth__panel"><div style="text-align:center;margin-bottom:24px"><a href="index.html" class="brand" aria-label="Kontrol"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 5v14M10 12l8-7M10 12l8 7"/></svg></span><span class="brand-word">kontrol<span>.</span></span></a></div>
      <div class="auth__card">
        <form data-auth="forgot">
          <div class="auth-icon"><i data-lucide="key-round"></i></div>
          <h1 class="auth-title">Lupa kata sandi?</h1>
          <p class="text-secondary mt-2">Masukkan email akun Anda. Kami akan mengirim tautan untuk mengatur ulang kata sandi.</p>
          <div class="stack mt-6" style="gap:14px">
            <div class="field"><label class="label" for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
            <button type="submit" class="btn btn-primary btn-lg btn-block"><i data-lucide="send"></i><span>Kirim tautan reset</span></button>
            <a href="login.html" class="btn btn-ghost btn-block"><i data-lucide="arrow-left"></i><span>Kembali ke halaman masuk</span></a>
          </div>
        </form>
        <div data-success hidden style="text-align:center">
          <div class="auth-icon" style="margin:0 auto 20px;background:var(--success-bg);color:var(--success)"><i data-lucide="mail-check"></i></div>
          <h1 class="auth-title">Periksa email Anda</h1>
          <p class="text-secondary mt-2">Jika <strong data-email-out></strong> terdaftar, tautan reset akan tiba dalam beberapa menit. Tautan berlaku 60 menit.</p>
          <div class="stack mt-6" style="gap:10px"><a href="reset-password.html" class="btn btn-primary btn-block">Buka tautan reset (demo)</a><button type="button" class="btn btn-ghost btn-block" data-resend="30">Kirim ulang</button></div>
          <div class="alert alert--success mt-4" data-note hidden><i data-lucide="circle-check"></i><div><p class="alert__text"></p></div></div>
        </div>
      </div>
      <p class="auth-foot">© 2026 Kontrol · <a href="index.html#/help">Bantuan</a></p>
    </section>
  </main>
  <script src="assets/vendor/lucide/lucide.min.js"></script>
  <script src="assets/js/core/validate.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
