<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Atur ulang kata sandi · Kontrol</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('kontrol:theme') || '"system"');
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <button type="button" class="icon-btn theme-fab" data-theme-toggle aria-label="Ganti tema"></button>
  <main class="auth auth--center">
    <section class="auth__panel"><div style="text-align:center;margin-bottom:24px"><a href="index.html" class="brand" aria-label="Kontrol"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 5v14M10 12l8-7M10 12l8 7"/></svg></span><span class="brand-word">kontrol<span>.</span></span></a></div>
      <div class="auth__card">
        <form data-auth="reset">
          <div class="auth-icon"><i data-lucide="lock-keyhole"></i></div>
          <h1 class="auth-title">Atur kata sandi baru</h1>
          <p class="text-secondary mt-2">Kata sandi baru harus berbeda dari yang sebelumnya.</p>
          <div class="stack mt-6" style="gap:14px">
            <input type="hidden" name="token" value="demo-token">
            <div class="field"><label class="label" for="password">Kata sandi baru</label><div class="input-icon"><input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" style="padding-right:44px"  data-strength="#password-meter"><span class="input-suffix"><button type="button" class="icon-btn icon-btn--sm" data-peek="#password" aria-label="Tampilkan kata sandi"><i data-lucide="eye"></i></button></span></div><div class="pw-meter" id="password-meter" aria-hidden="true"><span></span><span></span><span></span><span></span></div><p class="help" id="password-meter-label">Minimal 8 karakter, kombinasikan huruf besar, angka &amp; simbol.</p></div>
            <div class="field"><label class="label" for="password_confirmation">Ulangi kata sandi</label><input class="input" id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required data-match="#password" data-msg-match="Konfirmasi kata sandi tidak cocok."></div>
            <button type="submit" class="btn btn-primary btn-lg btn-block"><i data-lucide="check"></i><span>Simpan kata sandi</span></button>
          </div>
        </form>
        <div data-success hidden style="text-align:center">
          <div class="auth-icon" style="margin:0 auto 20px;background:var(--success-bg);color:var(--success)"><i data-lucide="circle-check"></i></div>
          <h1 class="auth-title">Kata sandi diperbarui</h1>
          <p class="text-secondary mt-2">Semua sesi lain telah dikeluarkan demi keamanan.</p>
          <a href="login.html" class="btn btn-primary btn-lg btn-block mt-6"><i data-lucide="log-in"></i><span>Masuk sekarang</span></a>
        </div>
      </div>
      <p class="auth-foot">© 2026 Kontrol · <a href="index.html#/help">Bantuan</a></p>
    </section>
  </main>
  <script src="assets/vendor/lucide/lucide.min.js"></script>
  <script src="assets/js/core/validate.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
